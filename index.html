    <style>
        body {
            background-color: #F3EFE0;
            color: #0F2A3F;
        }

        .fade-in {

<body
    class="bg-[#F3EFE0] text-[#0F2A3F] h-screen flex overflow-hidden font-sans selection:bg-[#E65C19] selection:text-white">

    <div id="loading-overlay"

                </span>
                <span class="text-[#2F70B3] text-xs font-bold hidden sm:inline tracking-wider uppercase">| GASTRONOMÍA & TURISMO</span>

            <!-- 3. Buscador en Header -->

                        oninput="handleSearchInput(this.value)"

                    <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-white">

    <script>
        // --- CONFIGURACIÓN DE CSVs ---
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwnZA7s0yysf5rIflyyj6WNhe_XddN2OCZ6SBJfB06LFm7fANQeZfHTs7GtSlLVXmNoG16BhVStAkD/pub?gid=47128061&single=true&output=csv';
        const EVENTOS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwnZA7s0yysf5rIflyyj6WNhe_XddN2OCZ6SBJfB06LFm7fANQeZfHTs7GtSlLVXmNoG16BhVStAkD/pub?gid=584577480&single=true&output=csv';
        const EVENTOS_PUNTUALES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwnZA7s0yysf5rIflyyj6WNhe_XddN2OCZ6SBJfB06LFm7fANQeZfHTs7GtSlLVXmNoG16BhVStAkD/pub?gid=1883625439&single=true&output=csv';

        // Generar COLS dinámicamente para mejor mantenibilidad
        const COLS = {

            idsitio: 0, sitio: 1, autonomia: 2, provincia: 3, ciudad: 4,
            barrio: 5, orden: 6, valoracion: 7, codprecio: 8, precio: 9,
            barloultimo: 10, precioultimo: 11, barbreve: 12, bardetalle: 13,
            comida: 14, tipositio: 15, direccion: 16, horario: 17,
            googleresenas: 18, maps: 19, facebook: 20, instagram: 21,
            postinstagram: 22, web: 23
        };

        // Generar columnas de fotos dinámicamente (foto1-foto40, text1-text40)       
        for (let i = 1; i <= 40; i++) {
            COLS[`foto${i}`] = 24 + (i - 1) * 2;
            COLS[`text${i}`] = 25 + (i - 1) * 2;
        }

        const COLS_EVENTOS = { eventoCulinario: 1, eventoMes: 2, eventoCulinarioDescripcion: 3, idSitio: 4, eventoAnyo: 5 };

        // Generar columnas de fotos dinámicamente (foto1-foto20, text1-text20)       
        for (let i = 1; i <= 20; i++) {
            COLS_EVENTOS[`foto${i}`] = 4 + (i - 1) * 2;
            COLS_EVENTOS[`text${i}`] = 5 + (i - 1) * 2;
        }

        // Constantes para códigos de precio
        const PRICE_CODES = {
            VERY_GOOD: 10,
            FAIR: 11,
            EXPENSIVE: 12
        };

        let DATA = [];
        let DISTANCIAS = [];

        const MENUS = [
            { id: 'landing', label: 'Inicio', icon: 'home' },
            { id: 'pintxos', label: 'Pintxos, Tapas...', icon: 'utensils-crossed', keywords: ['pintxo', 'tapa', 'bar'] },
            { id: 'restaurantes', label: 'Restaurantes', icon: 'chef-hat', keywords: ['restaurante', 'asador', 'comida'] },
            { id: 'bodegas', label: 'Bodegas', icon: 'wine', keywords: ['bodega', 'vino', 'catas'] },
            { id: 'turismo', label: 'Turismo', icon: 'compass', keywords: ['turismo', '', 'museo'] },
            { id: 'eventosCulinarios', label: 'Eventos Culinarios', icon: 'calendar-heart' },
            { id: 'eventosTuristicos', label: 'Eventos Turisticos', icon: 'map' },
            { id: 'tiendas', label: 'Tiendas', icon: 'shopping-bag', keywords: ['tienda', 'comercio', 'gourmet'] },
            { id: 'curiosidades', label: 'Carteles, Señales', icon: 'help-circle', keywords: ['curiosidad', 'cartel', 'señal'] },
        ];

        const state = {
            view: 'landing',
            filters: {},
            selectedItem: null,
            filterStep: 0,
            searchQuery: '',

            // Método helper para resetear estado
            reset() {
                this.filters = {};
                this.selectedItem = null;
                this.filterStep = 0;
                this.searchQuery = '';
            }
        };

        // --- BUSCADOR Y NAVEGACIÓN DINÁMICA ---
        function handleSearchInput(value) {
            state.searchQuery = (value || '').trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) {
                clearBtn.classList.toggle('hidden', !state.searchQuery);
            }
            // Al buscar, salimos del detalle para ver los resultados
            state.selectedItem = null;
            renderAppContent();
        }

        function clearSearch() {
            state.searchQuery = '';
            const input = document.getElementById('global-search-input');
            if (input) input.value = '';
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) clearBtn.classList.add('hidden');
            renderAppContent();
        }

        function renderFooter() {
            const footerNav = document.getElementById('footer-nav');
            if (!footerNav) return;

            footerNav.innerHTML = MENUS.map(item => {
                const isActive = state.view === item.id && !state.searchQuery;
                return `
                    <button onclick="clearSearch(); navigate('${item.id}')" title="${escapeHtml(item.label)}"
                        class="p-2 sm:px-3 sm:py-2 rounded-full transition-all duration-300 flex items-center justify-center gap-1.5 cursor-pointer shadow-sm ${isActive ? 'bg-[#E65C19] text-white scale-110 ring-2 ring-white/60 font-bold' : 'bg-[#FAF7EF] text-[#0F2A3F] hover:bg-white hover:scale-105'}">
                        <i data-lucide="${item.icon}" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        <span class="sr-only sm:not-sr-only text-xs font-bold hidden md:inline">${escapeHtml(item.label)}</span>
                    </button>
                `;
            }).join('');

            refreshIcons();
        }

        // --- FUNCIONES HELPER ---

        // Escapar HTML para prevenir XSS
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Helper para crear iconos
        function createIcon(lucideIcon, width = 24, height = 24, classes = '') {
            return `<i data-lucide="${lucideIcon}" ${width ? `width="${width}"` : ''} ${height ? `height="${height}"` : ''} ${classes ? `class="${classes}"` : ''}></i>`;
        }

        // Helper para reinicializar iconos de Lucide
        function refreshIcons() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // Debounce helper para optimización
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // --- PARSER CSV ---
        function parseCSV(csvText) {
            const rows = []; let fields = []; let currentField = ''; let inQuotes = false;
            csvText = csvText.trim();
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                if (char === '"') {
                    if (inQuotes && i + 1 < csvText.length && csvText[i + 1] === '"') { currentField += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    fields.push(currentField); currentField = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    fields.push(currentField); rows.push(fields); fields = []; currentField = '';
                    if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') i++;
                } else { currentField += char; }
            }
            if (fields.length > 0 || currentField !== '') { fields.push(currentField); rows.push(fields); }
            return rows.map(row => row.map(field => field.trim()));
        }

        // --- INICIALIZACIÓN DE DATOS ---
        async function loadData() {
            try {
                if (window.location.protocol === 'file:') {
                    throw new Error("cfile_protocol_error");
                }

                const [sitesRes, eventsRes, eventsPuntualesRes, distanciasRes] = await Promise.all([
                    fetch(CSV_URL),
                    fetch(EVENTOS_CSV_URL),
                    fetch(EVENTOS_PUNTUALES_CSV_URL),
                    fetch('distancias.json').catch(e => null)
                ]);

                const sitesRaw = parseCSV(await sitesRes.text()).slice(1);
                const eventsRaw = parseCSV(await eventsRes.text()).slice(1);
                const eventsPuntualesRaw = parseCSV(await eventsPuntualesRes.text()).slice(1);

                if (distanciasRes && distanciasRes.ok) {
                    try {
                        DISTANCIAS = await distanciasRes.json();
                    } catch(e) {
                        console.error('Error al cargar distancias:', e);
                    }
                }

                const sitesProcessed = sitesRaw.map(row => {
                    let type = 'pintxos';

                    // 1. Obtenemos el valor y lo pasamos a minúsculas para comparar mejor
                    const rawType = (row[COLS.tipositio] || '').toLowerCase().trim();

                    // 2. Asignamos el tipo según lo que contenga la celda
                    if (rawType.includes('bar') || rawType.includes('bar y restaurante')) {
                        type = 'pintxos';
                    } else if (rawType.includes('restaurante') || rawType.includes('bar y restaurante')) {
                        type = 'restaurantes';
                    } else if (rawType.includes('bodega') || rawType.includes('vino')) {
                        type = 'bodegas';
                    } else if (rawType.includes('tienda') || rawType.includes('comercio')) {
                        type = 'tiendas';
                    } else if (rawType.includes('curiosidad')) {
                        type = 'curiosidades';
                    } else {
                        // Para turismo, museos o cualquier otro caso no contemplado arriba
                        type = 'turismo';
                    }

                    const gallery = [];
                    for (let i = 1; i <= 40; i++) {
                        const photoIdx = 24 + (i - 1) * 2;
                        const textIdx = 25 + (i - 1) * 2;
                        if (row[photoIdx]) {
                            gallery.push({
                                url: `https://drive.google.com/thumbnail?id=${row[photoIdx]}&sz=w800`,
                                caption: row[textIdx] || ''
                            });
                        }
                    }

                    let rawVal = String(row[COLS.valoracion] || '100').replace(',', '.');
                    let valNum = parseFloat(rawVal);
                    let finalRating = (isNaN(valNum) || valNum < 100) ? 0 : (valNum - 100) / 10;
                    return {
                        id: row[COLS.idsitio] || Math.random().toString(),
                        type: type,
                        name: row[COLS.sitio],
                        autonomia: row[COLS.autonomia],
                        provincia: row[COLS.provincia],
                        ciudad: row[COLS.ciudad],
                        barrio: row[COLS.barrio],
                        rating: finalRating,
                        priceCode: row[COLS.codprecio] || '',
                        price: row[COLS.precio] || '',
                        loultimo: row[COLS.barloultimo] || '',
                        precioultimo: row[COLS.precioultimo] + ' €' || '',
                        desc: row[COLS.barbreve] || 'Sin descripción disponible.',
                        fullDesc: row[COLS.bardetalle] || '',
                        comida: row[COLS.comida] || '',
                        image: gallery[0] ? gallery[0].url : 'https://placehold.co/600x400?text=Sin+Foto',
                        address: row[COLS.direccion],
                        hours: row[COLS.horario],
                        links: {
                            maps: row[COLS.maps],
                            web: row[COLS.web],
                            reviews: row[COLS.googleresenas],
                            instagram: row[COLS.instagram],
                            facebook: row[COLS.facebook],
                            post: row[COLS.postinstagram]
                        },
                        gallery: gallery
                    };
                });

                const eventsProcessed = eventsRaw.map((row, idx) => {
                    const gallery = [];
                    for (let i = 1; i <= 20; i++) {
                        const photoCol = COLS_EVENTOS[`foto${i}`];
                        const textCol = COLS_EVENTOS[`text${i}`];

                        if (photoCol && row[photoCol]) {
                            gallery.push({
                                url: `https://drive.google.com/thumbnail?id=${row[photoCol]}&sz=w800`,
                                caption: row[textCol] || ''
                            });
                        }
                    }

                    return {
                        id: `evt-${idx}`,
                        idSitio: row[COLS_EVENTOS.idSitio],
                        type: 'eventosCulinarios',
                        name: row[COLS_EVENTOS.eventoCulinario],
                        mes: row[COLS_EVENTOS.eventoMes],
                        anyo: row[COLS_EVENTOS.eventoAnyo],
                        desc: row[COLS_EVENTOS.eventoCulinarioDescripcion],
                        rating: 5,
                        gallery: gallery
                    };
                });

                const eventsPuntualesProcessed = eventsPuntualesRaw.map((row, idx) => {
                    const gallery = [];
                    for (let i = 1; i <= 20; i++) {
                        const photoCol = COLS_EVENTOS[`foto${i}`];
                        const textCol = COLS_EVENTOS[`text${i}`];
                        if (photoCol && row[photoCol]) {
                            gallery.push({
                                url: `https://drive.google.com/thumbnail?id=${row[photoCol]}&sz=w800`,
                                caption: row[textCol] || ''
                            });
                        }
                    }
                    return {
                        id: `evt-puntual-${idx}`,
                        idSitio: row[COLS_EVENTOS.idSitio],
                        type: 'eventosPuntuales',
                        name: row[COLS_EVENTOS.eventoCulinario],
                        mes: row[COLS_EVENTOS.eventoMes],
                        anyo: row[COLS_EVENTOS.eventoAnyo],
                        desc: row[COLS_EVENTOS.eventoCulinarioDescripcion],
                        rating: 5,
                        gallery: gallery
                    };
                });

                DATA = [...sitesProcessed, ...eventsProcessed, ...eventsPuntualesProcessed];

                document.getElementById('loading-overlay').classList.add('opacity-0', 'pointer-events-none');
                initApp();

            } catch (err) {
                console.error("Error cargando datos:", err);
                const loadingText = document.getElementById('loading-text');
                const loader = document.querySelector('.loader');
                if (loader) loader.style.display = 'none';
                if (loadingText) {
                    if (window.location.protocol === 'file:' || err.message === 'cfile_protocol_error') {
                        loadingText.innerHTML = `
                            <div class="max-w-md mx-4 p-6 bg-white rounded-2xl shadow-xl border border-red-200 text-center">
                                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">⚠️</div>
                                <h3 class="font-brand text-xl text-red-600 font-bold mb-2">Se requiere servidor web</h3>
                                <p class="text-xs sm:text-sm text-slate-600 mb-4 leading-relaxed">
                                    Has abierto <code>index.html</code> como un archivo local (<code>file://</code>). Por motivos de seguridad (CORS), los navegadores bloquean las peticiones <code>fetch</code> a Google Sheets.
                                </p>
                                <div class="bg-slate-50 p-3 rounded-lg text-left text-xs text-slate-700 font-mono mb-4 border border-slate-200 space-y-1">
                                    <p class="font-sans font-bold text-slate-900 mb-1">💡 Para verlo correctamente:</p>
                                    <p>1. <strong>VS Code:</strong> Clic derecho en <code>index.html</code> ➔ <em>Open with Live Server</em></p>
                                    <p>2. <strong>Terminal:</strong> <code>npx serve</code> o <code>python -m http.server 8000</code></p>
                                    <p>3. <strong>Hosting:</strong> GitHub Pages / Vercel / Netlify</p>
                                </div>
                                <button onclick="location.reload()" class="px-5 py-2 bg-[#0F2A3F] text-white rounded-xl hover:bg-[#E65C19] transition-all font-semibold text-sm shadow-md">
                                    Reintentar
                                </button>
                            </div>
                        `;
                    } else {
                        loadingText.innerHTML = `
                            <span class="text-red-600 font-bold">¡Ups! Algo falló.</span><br>
                            <span class="text-sm text-red-400">${escapeHtml(err.message)}</span><br>
                            <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-[#0F2A3F] text-white rounded-lg hover:bg-[#E65C19] transition-colors font-bold">
                                Reintentar
                            </button>
                        `;
                    }
                }
            }
        }

        function initApp() {
            renderSidebar();
            renderFooter();
            navigate('landing');
            refreshIcons();

            // Inicializar todos los popovers
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
            var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl, {
                    trigger: 'click',    // Se activa al hacer clic
                    container: 'body',   // Se renderiza en el body para evitar problemas de z-index
                    html: true           // Permite HTML dentro
                });
            });
            // Cerrar popover al hacer clic fuera de él
            document.addEventListener('click', function (e) {
                popoverList.forEach(function (popover) {
                    if (!popover._element.contains(e.target) &&  // Si el click no fue en el botón
                        document.querySelector('.popover') &&    // Y existe un popover abierto
                        !document.querySelector('.popover').contains(e.target)) { // Y el click no fue dentro del popover
                        popover.hide();
                    }
                });
            });
        }

        // --- NAVEGACIÓN Y UI ---

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function navigate(viewId) {
            state.view = viewId;
            state.filters = {};
            state.selectedItem = null;
            state.filterStep = 0;

            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');

            updateActiveMenu(viewId);
            renderAppContent();
        }

        function updateActiveMenu(viewId) {
            renderSidebar();
            renderFooter();
        }

        function renderSidebar() {
            const container = document.getElementById('nav-menu');
            container.innerHTML = MENUS.map(item => `
                <button onclick="clearSearch(); navigate('${item.id}')" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl transition-all duration-200 group ${state.view === item.id && !state.searchQuery ? 'bg-[#E65C19] text-white font-bold shadow-lg shadow-orange-950/40 translate-x-1' : 'hover:bg-[#2F70B3]/20 text-slate-200 hover:text-white hover:translate-x-1'}">
                    <i data-lucide="${item.icon}" class="${state.view === item.id && !state.searchQuery ? 'text-white' : 'text-[#2F70B3]'}"></i>
                    <span class="font-medium">${item.label}</span>
                </button>
            `).join('');
            renderFooter();
            refreshIcons();
        }

        function renderSearchResultsHtml(query) {
            const q = query.toLowerCase();
            const results = DATA.filter(item => {
                const name = (item.name || '').toLowerCase();
                const desc = (item.desc || '').toLowerCase();
                const fullDesc = (item.fullDesc || '').toLowerCase();
                const comida = (item.comida || '').toLowerCase();
                const ciudad = (item.ciudad || '').toLowerCase();
                const provincia = (item.provincia || '').toLowerCase();
                const autonomia = (item.autonomia || '').toLowerCase();
                const barrio = (item.barrio || '').toLowerCase();
                return name.includes(q) || desc.includes(q) || fullDesc.includes(q) || comida.includes(q) || ciudad.includes(q) || provincia.includes(q) || autonomia.includes(q) || barrio.includes(q);
            });

            return `
                <div class="fade-in pb-24 max-w-7xl mx-auto">
                    <header class="mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-[#E2DAC6] pb-4">
                        <div>
                            <h1 class="text-3xl font-brand font-black text-[#0F2A3F]">Resultados de búsqueda</h1>
                            <p class="text-slate-500 text-sm mt-1">Buscando: "<span class="font-bold text-[#E65C19]">${escapeHtml(query)}</span>" — ${results.length} coincidencias</p>
                        </div>
                        <button onclick="clearSearch()" class="text-xs font-bold text-[#0F2A3F] bg-white px-4 py-2 rounded-xl border border-[#E2DAC6] hover:bg-[#FAF7EF] transition-all shadow-sm flex items-center gap-1.5">
                            <i data-lucide="x" width="14"></i> Limpiar búsqueda
                        </button>
                    </header>
                    ${results.length === 0 ? `
                        <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-[#E2DAC6]">
                            <div class="bg-[#FAF7EF] w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-[#E65C19]">
                                <i data-lucide="search-x" width="28" height="28"></i>
                            </div>
                            <p class="text-[#0F2A3F] font-bold text-lg">No encontramos resultados para "${escapeHtml(query)}".</p>
                            <p class="text-slate-500 text-sm mt-1">Prueba a buscar por ciudad (ej: Ávila, León, Zaragoza), tipo de plato o nombre del local.</p>
                            <button onclick="clearSearch()" class="mt-4 px-5 py-2.5 bg-[#0F2A3F] text-white rounded-full font-bold text-sm hover:bg-[#E65C19] transition">Ver todos los sitios</button>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            ${results.map(item => renderCard(item)).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderAppContent() {
            const container = document.getElementById('app-content');
            container.innerHTML = '';

            let htmlContent = '';

            if (state.selectedItem) {
                htmlContent = getDetailHtml(state.selectedItem);
            } else if (state.searchQuery) {
                htmlContent = renderSearchResultsHtml(state.searchQuery);
            } else if (state.view === 'landing') {
                htmlContent = getLandingHtml();
            } else {
                const type = state.view;
                if (['eventosCulinarios', 'eventosTuristicos'].includes(type)) {
                    htmlContent = getSectionMonthHtml(type);
                } else if (['tiendas', 'curiosidades'].includes(type)) {
                    htmlContent = getSectionAlphaHtml(type);
                } else {
                    htmlContent = getSectionLocationHtml(type);
                }
            }
            container.innerHTML = htmlContent;
            renderFooter();
            refreshIcons();
            container.scrollTo(0, 0);
        }

        // --- VISTAS ---

        function getLandingHtml() {
            const cards = MENUS.filter(m => m.id !== 'landing');

            return `
                <div class="fade-in max-w-6xl mx-auto pb-32">
                    <section class="relative h-[480px] rounded-3xl overflow-hidden mb-10 shadow-2xl border border-[#E2DAC6]">
                        <img src="https://drive.google.com/thumbnail?id=16FRveDGCnFoiLNLkAADY3MblBrIgYhWX&sz=w1200" class="w-full h-full object-cover">

                    <div class="mb-10 bg-[#FAF7EF] rounded-3xl p-8 border border-[#E2DAC6] shadow-sm flex flex-col md:flex-row items-center gap-8">

                            <h2 class="text-2xl md:text-3xl font-black text-[#0F2A3F] mb-3 font-brand">¡Bienvenido a <span class="text-[#E65C19]">COMO</span><span class="text-[#0F2A3F]">VISITO</span>! 👋</h2>
                          
                            <p class="mb-2 text-[#0F2A3F]/80 leading-relaxed text-lg font-medium">

                            </p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                        ${cards.map((c) => {
                            return `
                                <button onclick="navigate('${escapeHtml(c.id)}')" class="bg-white hover:bg-[#FAF7EF] border border-[#E2DAC6] p-6 rounded-3xl shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-1 flex flex-col items-center justify-center aspect-square text-center group cursor-pointer w-full">
                                    <div class="bg-[#F3EFE0] p-4 rounded-full mb-4 shadow-inner group-hover:scale-110 group-hover:bg-[#E65C19] transition-all duration-300">
                                        <i data-lucide="${c.icon}" class="text-[#0F2A3F] group-hover:text-white transition-colors" width="32" height="32"></i>

                                    <span class="font-bold text-[#0F2A3F] group-hover:text-[#E65C19] font-brand text-base md:text-lg transition-colors">${escapeHtml(c.label)}</span>

        // --- FILTROS Y GRID ---

        function selectFilter(level, value) {
            state.filters[level] = value;
            state.filterStep++;
            renderAppContent();
        }

        function resetFilters() {
            state.filters = {};
            state.filterStep = 0;
            renderAppContent();
        }

        function showAllFilters() {
            state.filterStep = 99;
            renderAppContent();
        }

        function goBackOneStep() {
            const levels = ['autonomia', 'provincia', 'ciudad', 'barrio'];
            const currentType = state.view;

            if (state.filterStep === 0 && Object.keys(state.filters).length === 0) {
                navigate('landing');
                return;
            }

            if (state.filterStep === 99) {
                const activeFilters = levels.filter(l => state.filters[l]);
                if (activeFilters.length === 0) {
                    navigate('landing');
                } else {
                    state.filterStep = activeFilters.length - 1;
                    renderAppContent();
                }
                return;
            }

            const activeFilters = levels.filter(l => state.filters[l]);

            if (activeFilters.length > 0) {
                const lastFilter = activeFilters[activeFilters.length - 1];
                delete state.filters[lastFilter];
                state.filterStep = activeFilters.length - 1;
            } else {
                state.filterStep = Math.max(0, state.filterStep - 1);
            }

            const currentData = DATA.filter(d => d.type === currentType &&
                Object.keys(state.filters).every(k => d[k] === state.filters[k])
            );

            if (state.filterStep < levels.length) {
                const currentLevel = levels[state.filterStep];
                const options = [...new Set(currentData.map(item => item[currentLevel]))].filter(Boolean);

                if (options.length <= 1 && (state.filterStep > 0 || Object.keys(state.filters).length > 0)) {
                    goBackOneStep();
                    return;
                }
            }

            renderAppContent();
        }

        function getSectionLocationHtml(type) {
            const levels = ['autonomia', 'provincia', 'ciudad', 'barrio'];

            const currentData = DATA.filter(d => d.type === type &&
                Object.keys(state.filters).every(k => d[k] === state.filters[k])
            );

            const sectionTitle = MENUS.find(m => m.id === type)?.label || type;

            while (state.filterStep < levels.length) {
                let currentLevel = levels[state.filterStep];
                const options = [...new Set(currentData.map(item => item[currentLevel]))].filter(Boolean).sort();

                if (options.length === 0) {
                    state.filterStep = 99;
                    break;
                } else if (options.length === 1) {
                    state.filters[currentLevel] = options[0];
                    state.filterStep++;
                } else {
                    return renderFilterWizard(sectionTitle, currentLevel, options);
                }
            }

            return renderResultsGrid(sectionTitle, currentData);
        }

        function renderFilterWizard(title, level, options) {
            const levelLabel = level.charAt(0).toUpperCase() + level.slice(1);
            
            const levels = ['autonomia', 'provincia', 'ciudad', 'barrio'];
            const path = levels.map(l => state.filters[l]).filter(Boolean);
            const pathHtml = path.length > 0 ? `
                <div class="flex flex-wrap justify-center items-center gap-2 mb-6 text-xs font-bold text-[#2F70B3] bg-[#FAF7EF] py-2.5 px-4 rounded-full border border-[#E2DAC6] shadow-xs">
                    ${path.join(' <i data-lucide="chevron-right" width="12" class="text-[#E65C19]"></i> ')}
                </div>
            ` : '';

            return `
                <div class="fade-in max-w-lg mx-auto p-6 mt-4">
                    <button onclick="goBackOneStep()" class="mb-6 flex items-center text-slate-600 font-bold hover:text-[#E65C19] transition-colors">
                        <div class="w-8 h-8 rounded-full bg-[#FAF7EF] border border-[#E2DAC6] flex items-center justify-center mr-2 group-hover:bg-[#E65C19] group-hover:text-white">
                            <i data-lucide="arrow-left" width="18"></i>
                        </div>
                        Atrás / Anterior
                    </button>

                    <h2 class="text-3xl font-brand font-black mb-2 text-center text-[#0F2A3F]">
                        ${title}
                    </h2>
                    ${pathHtml}
                    <p class="text-center text-slate-500 mb-8 font-medium">Selecciona ${levelLabel}:</p>
                    
                    <div class="space-y-3">
                        ${options.map(opt => `
                            <button onclick="selectFilter('${level}', '${opt}')" class="w-full p-5 rounded-2xl shadow-sm border border-[#E2DAC6] flex justify-between items-center hover:border-[#E65C19] hover:bg-[#FAF7EF] transition-all bg-white group text-[#0F2A3F]">
                                <span class="text-lg font-bold">${opt}</span>
                                <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-[#E65C19] transition-colors"></i>
                            </button>
                        `).join('')}
                    </div>
                    <div class="mt-8 pt-6 border-t border-[#E2DAC6]">
                        <button onclick="showAllFilters()" class="w-full py-4 rounded-xl bg-[#0F2A3F] text-white font-bold shadow-lg hover:bg-[#E65C19] transition-all">
                            Mostrar todos los resultados
                        </button>
                    </div>
                </div>
            `;
        }

        function getSectionMonthHtml(type) {
            const rawData = DATA.filter(d => d.type === type);
            const monthsOrder = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

            const grouped = rawData.reduce((acc, item) => {
                const m = item.mes || 'Sin Fecha';
                (acc[m] = acc[m] || []).push(item);
                return acc;
            }, {});

            const sortedMonths = Object.keys(grouped).sort((a, b) => {
                const idxA = monthsOrder.indexOf(a);
                const idxB = monthsOrder.indexOf(b);
                if (idxA === -1) return 1;
                if (idxB === -1) return -1;
                return idxA - idxB;
            });

            const title = MENUS.find(m => m.id === type)?.label || type;

            return `
                <div class="fade-in pb-24 max-w-7xl mx-auto">
                    <header class="mb-8 border-b-4 border-[#E65C19] inline-block pb-2">
                        <h1 class="text-3xl font-brand font-black text-[#0F2A3F]">${title}</h1>
                    </header>
                    <div class="space-y-12">
                        ${sortedMonths.map(month => `
                            <div class="relative">
                                <div class="sticky top-0 z-10 bg-[#F3EFE0]/95 backdrop-blur py-3 mb-4 border-b border-[#E2DAC6] flex items-center">
                                    <span class="bg-[#0F2A3F] text-white px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider mr-3">${month}</span>
                                    <span class="text-slate-500 text-sm font-medium">${grouped[month].length} eventos</span>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    ${grouped[month].map(item => renderCard(item)).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function getSectionAlphaHtml(type) {
            const rawData = DATA.filter(d => d.type === type).sort((a, b) => a.name.localeCompare(b.name));
            const title = MENUS.find(m => m.id === type)?.label || type;
            return renderResultsGrid(title, rawData, false);
        }

        function renderResultsGrid(title, items, showFilterBtn = true) {
            const hasFilters = Object.keys(state.filters).length > 0;
            const canGoBack = hasFilters || state.filterStep === 99;

            if (items.length === 0) {
                return `
                      <div class="fade-in pb-24 max-w-7xl mx-auto">
                         <header class="mb-8 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <button onclick="goBackOneStep()" class="p-2 bg-white rounded-full border border-[#E2DAC6] hover:bg-[#0F2A3F] hover:text-white transition"><i data-lucide="arrow-left"></i></button>
                                <h1 class="text-3xl font-brand font-black text-[#0F2A3F]">${title}</h1>
                            </div>
                            ${showFilterBtn && hasFilters ? `
                                <div class="flex items-center gap-3 flex-wrap justify-end">
                                    <div class="flex items-center gap-2 text-xs font-bold text-[#2F70B3] bg-white px-3 py-2 rounded-lg border border-[#E2DAC6] shadow-sm">
                                        ${Object.values(state.filters).join(' <i data-lucide="chevron-right" width="12" class="text-[#E65C19]"></i> ')}
                                    </div>
                                    <button onclick="resetFilters()" class="text-xs font-bold text-white bg-[#0F2A3F] px-3 py-2 rounded-lg hover:bg-[#E65C19] transition-all shadow-md">
                                        Borrar filtros
                                    </button>
                                </div>
                            ` : ''}
                         </header>
                         <div class="text-center py-20 bg-white rounded-3xl border border-dashed border-[#E2DAC6]">
                             <div class="bg-[#FAF7EF] w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-[#E65C19]">
                                <i data-lucide="search" width="32" height="32"></i>
                             </div>
                             <p class="text-[#0F2A3F] font-bold text-lg">No hemos encontrado nada aquí.</p>
                             <button onclick="goBackOneStep()" class="text-[#0F2A3F] font-bold mt-4 border border-[#0F2A3F] px-5 py-2.5 rounded-full hover:bg-[#0F2A3F] hover:text-white transition">Volver atrás</button>
                         </div>
                      </div>
                `;
            }

            return `
                <div class="fade-in pb-24 max-w-7xl mx-auto">
                    <header class="mb-8">
                        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                            <div class="flex items-start gap-4">
                                ${canGoBack ? `
                                <button onclick="goBackOneStep()" class="mt-1 p-2.5 bg-white rounded-full shadow-sm border border-[#E2DAC6] hover:bg-[#0F2A3F] hover:text-white transition-colors group" title="Volver un paso">
                                    <i data-lucide="arrow-left" width="20"></i>
                                </button>
                                ` : ''}
                                
                                <div>
                                    <h1 class="text-3xl font-brand font-black text-[#0F2A3F]">${title}</h1>
                                    <p class="text-slate-500 text-sm mt-1">Mostrando ${items.length} resultados</p>
                                </div>
                            </div>

                            ${showFilterBtn && hasFilters ? `
                                <div class="flex items-center gap-3 flex-wrap justify-end">
                                    <div class="flex items-center gap-2 text-xs font-bold text-[#2F70B3] bg-white px-3 py-2 rounded-lg border border-[#E2DAC6] shadow-sm">
                                        ${Object.values(state.filters).join(' <i data-lucide="chevron-right" width="12" class="text-[#E65C19]"></i> ')}
                                    </div>
                                    <button onclick="resetFilters()" class="text-xs font-bold text-white bg-[#0F2A3F] px-3 py-2 rounded-lg hover:bg-[#E65C19] transition-all shadow-md">
                                        Borrar filtros
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </header>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        ${items.map(item => renderCard(item)).join('')}
                    </div>
                </div>
            `;
        }

        // --- VISTA DETALLE ---

                                        <img src="${img.url}" class="w-full h-full object-cover transform group-hover:scale-110 transition duration-500" loading="lazy">
                                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition"></div>
                                        <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur text-white p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i data-lucide="maximize-2" width="16" height="16"></i>
                                        </div>
                                        ${img.caption ? `<div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent text-white text-[10px] p-3 pt-6 opacity-0 group-hover:opacity-100 transition translate-y-2 group-hover:translate-y-0 font-medium truncate">${img.caption}</div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>` : ''} 
                        ${eventosPuntualesRelacionados.length > 0 ? `
                            <div class="mt-6 border-t border-dashed border-[#E2DAC6] pt-6">
                               <h3 class="text-lg font-brand font-black text-[#0F2A3F] mb-6 pl-4 border-l-4 border-[#E65C19]">Eventos Puntuales</h3>
                            </div>
                        ` : ''} 
                        ${eventosPuntualesRelacionados.map(evento => `
                            <div class="mt-6">
                                <h2 class="text-lg font-bold text-[#0F2A3F] mb-3 font-brand tracking-widest">${evento.name} ${evento.anyo}</h2>
                                ${evento.desc ? `${evento.desc}` : ''}
                            </div>
                        `).join('')} 
                        ${eventosPuntualesGallery.length > 0 ? `
                        <div class="mt-12 mb-12">
                            <h2 class="text-lg font-bold text-[#0F2A3F] mb-3 font-brand tracking-widest">Fotos de Eventos Puntuales</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                ${eventosPuntualesGallery.map((img, idx) => `
                                    <div onclick="openLightbox(${idx + eventosGallery.length}, 'events')" class="aspect-square rounded-2xl overflow-hidden cursor-pointer hover:opacity-90 transition shadow-md group relative hover:ring-4 hover:ring-[#E65C19]/40 border border-[#E2DAC6]">
                                        <img src="${img.url}" class="w-full h-full object-cover transform group-hover:scale-110 transition duration-500" loading="lazy">
                                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition"></div>
                                        <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur text-white p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i data-lucide="maximize-2" width="16" height="16"></i>
                                        </div>
                                        ${img.caption ? `<div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent text-white text-[10px] p-3 pt-6 opacity-0 group-hover:opacity-100 transition translate-y-2 group-hover:translate-y-0 font-medium truncate">${img.caption}</div>` : ''}
                                    </div>
                                `).join('')}
                           </div>
                           <div class="mb-20"></div>
                        </div>` : ''}                              
                    </div>
                </div>
            `;
        }

        // --- LÓGICA DEL LIGHTBOX ---
        let currentLightboxIndex = 0;
        let currentGalleryType = 'main'; // 'main' o 'events'

        function openLightbox(index, type = 'main') {
            if (!state.selectedItem) return;

            currentGalleryType = type;
            // Elegimos qué galería usar según el tipo
            const gallery = type === 'events' ? state.selectedItem.eventGallery : state.selectedItem.gallery;

            if (!gallery || gallery.length === 0) return;

            currentLightboxIndex = index;
            const lightbox = document.getElementById('lightbox');

            lightbox.classList.remove('hidden');
            setTimeout(() => {
                lightbox.classList.remove('opacity-0');
            }, 10);

            updateLightboxContent();

            document.addEventListener('keydown', handleLightboxKeys);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');

            setTimeout(() => {
                lightbox.classList.add('hidden');
            }, 300);

            document.removeEventListener('keydown', handleLightboxKeys);
            document.body.style.overflow = '';
        }

        function changeLightboxSlide(direction) {
            // Usamos la galería activa
            const gallery = currentGalleryType === 'events' ? state.selectedItem.eventGallery : state.selectedItem.gallery;
            currentLightboxIndex += direction;

            if (currentLightboxIndex >= gallery.length) currentLightboxIndex = 0;
            if (currentLightboxIndex < 0) currentLightboxIndex = gallery.length - 1;

            updateLightboxContent();
        }

        function updateLightboxContent() {
            // Usamos la galería activa
            const gallery = currentGalleryType === 'events' ? state.selectedItem.eventGallery : state.selectedItem.gallery;
            const item = gallery[currentLightboxIndex];

            const imgEl = document.getElementById('lightbox-img');
            const captionEl = document.getElementById('lightbox-caption');
            const counterEl = document.getElementById('lightbox-counter');

            imgEl.style.opacity = '0.5';
            setTimeout(() => imgEl.style.opacity = '1', 200);

            imgEl.src = item.url;

            if (item.caption) {
                captionEl.textContent = item.caption;
                captionEl.style.display = 'block';
            } else {
                captionEl.style.display = 'none';
            }

            counterEl.textContent = `${currentLightboxIndex + 1} de ${gallery.length}`;
        }

        function handleLightboxKeys(e) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeLightboxSlide(-1);
            if (e.key === 'ArrowRight') changeLightboxSlide(1);
        }

        // --- MAPA DE DISTANCIAS INTERACTIVO ---
        window.currentDistMap = null;
        window.currentDistMarkers = {};
        window.isMapFullscreen = false;

        function toggleDistMapFullscreen() {
            const container = document.getElementById('distancias-map-container');
            const mapEl = document.getElementById('dist-map');
            const iconEl = document.getElementById('fullscreen-icon');
            const textEl = document.getElementById('fullscreen-text');

            if (!container || !mapEl) return;

            window.isMapFullscreen = !window.isMapFullscreen;

            if (window.isMapFullscreen) {
                container.classList.add('fixed', 'inset-2', 'sm:inset-6', 'z-[1050]', 'bg-white', 'p-3', 'rounded-3xl', 'shadow-2xl', 'flex', 'flex-col', 'border-2', 'border-[#0F2A3F]');
                container.classList.remove('relative');
                mapEl.classList.remove('h-96', 'sm:h-[480px]', 'rounded-2xl');
                mapEl.classList.add('flex-1', 'w-full', 'h-full', 'rounded-2xl');
                if (iconEl) iconEl.setAttribute('data-lucide', 'minimize-2');
                if (textEl) textEl.textContent = 'Reducir';
            } else {
                container.classList.remove('fixed', 'inset-2', 'sm:inset-6', 'z-[1050]', 'bg-white', 'p-3', 'rounded-3xl', 'shadow-2xl', 'flex', 'flex-col', 'border-2', 'border-[#0F2A3F]');
                container.classList.add('relative');
                mapEl.classList.remove('flex-1', 'w-full', 'h-full');
                mapEl.classList.add('h-96', 'sm:h-[480px]', 'rounded-2xl');
                if (iconEl) iconEl.setAttribute('data-lucide', 'maximize-2');
                if (textEl) textEl.textContent = 'Ampliar mapa';
            }

            refreshIcons();

            if (window.currentDistMap) {
                setTimeout(() => {
                    window.currentDistMap.invalidateSize();
                }, 150);
            }
        }

        function focusDistMarker(destinoName) {
            if (window.currentDistMarkers && window.currentDistMarkers[destinoName]) {
                const marker = window.currentDistMarkers[destinoName];
                if (window.currentDistMap) {
                    window.currentDistMap.setView(marker.getLatLng(), 17, { animate: true });
                    marker.openPopup();
                }
            }
        }

        function switchDistView(mode) {
            const listContainer = document.getElementById('distancias-list-container');
            const mapContainer = document.getElementById('distancias-map-container');
            const btnList = document.getElementById('btn-dist-list');
            const btnMap = document.getElementById('btn-dist-map');

            if (!listContainer || !mapContainer) return;

            if (mode === 'list') {
                listContainer.classList.remove('hidden');
                mapContainer.classList.add('hidden');

                if (btnList && btnMap) {
                    btnList.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-[#0F2A3F] text-white shadow-sm flex items-center gap-1.5 cursor-pointer";
                    btnMap.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-[#0F2A3F] hover:bg-white/80 flex items-center gap-1.5 cursor-pointer";
                }
            } else {
                listContainer.classList.add('hidden');
                mapContainer.classList.remove('hidden');

                if (btnList && btnMap) {
                    btnMap.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-[#0F2A3F] text-white shadow-sm flex items-center gap-1.5 cursor-pointer";
                    btnList.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-[#0F2A3F] hover:bg-white/80 flex items-center gap-1.5 cursor-pointer";
                }

                if (state.selectedItem) {
                    initDistancesMap(state.selectedItem);
                }
            }
        }

        function extractCoords(item) {
            if (!item) return null;
            if (item.lat && item.lng) return [parseFloat(item.lat), parseFloat(item.lng)];
            
            const url = item.links ? item.links.maps : null;
            if (url) {
                // 1. Coordenadas explícitas de destino (!3d<lat>!4d<lng>)
                let m = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
                if (m) return [parseFloat(m[1]), parseFloat(m[2])];

                // 2. Coordenadas de destino en enlaces de ruta (!1d<lng>!2d<lat> o !2d<lat>!1d<lng>)
                m = url.match(/!1d(-?\d+\.\d+)!2d(-?\d+\.\d+)/);
                if (m) return [parseFloat(m[2]), parseFloat(m[1])];

                m = url.match(/!2d(-?\d+\.\d+)!1d(-?\d+\.\d+)/);
                if (m) return [parseFloat(m[1]), parseFloat(m[2])];

                // 3. Parámetros de consulta (?q=lat,lng o ?ll=lat,lng)
                m = url.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
                if (m) return [parseFloat(m[1]), parseFloat(m[2])];

                // 4. Posición de cámara/visor de Google Maps (@lat,lng) solo como último recurso
                m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                if (m) return [parseFloat(m[1]), parseFloat(m[2])];
            }

            const refText = `${item.pueblo || ''} ${item.ciudad || ''} ${item.provincia || ''} ${item.address || ''} ${item.name || ''}`.toLowerCase();
            if (refText.includes('ávila') || refText.includes('avila')) return [40.6565, -4.6818];
            if (refText.includes('león') || refText.includes('leon')) return [42.5987, -5.5671];
            if (refText.includes('basauri') || refText.includes('bilbao') || refText.includes('bizkaia')) return [43.235, -2.890];
            if (refText.includes('zaragoza')) return [41.656, -0.877];
            if (refText.includes('madrid')) return [40.4168, -3.7038];

            return null;
        }

        function initDistancesMap(originItem) {
            const mapElement = document.getElementById('dist-map');
            if (!mapElement) return;

            if (window.currentDistMap) {
                window.currentDistMap.remove();
                window.currentDistMap = null;
            }

            window.currentDistMarkers = {};

            const originCoords = extractCoords(originItem) || [40.6565, -4.6818];
            const distances = DISTANCIAS.filter(d => d.origen === originItem.name);

            const map = L.map('dist-map', {
                zoomControl: true,
                scrollWheelZoom: false,
                touchZoom: true,
                tap: true
            }).setView(originCoords, 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            window.currentDistMap = map;

            // Pin Origen (Terracota)
            const originIcon = L.divIcon({
                className: 'custom-map-pin-origin',
                html: `
                    <div class="relative flex items-center justify-center">
                        <div class="w-10 h-10 bg-[#E65C19] text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white ring-4 ring-[#E65C19]/30 animate-pulse">
                            <span class="text-base font-bold">📍</span>
                        </div>
                    </div>
                `,
                iconSize: [40, 40],
                iconAnchor: [20, 20],
                popupAnchor: [0, -20]
            });

            const originMarker = L.marker(originCoords, { icon: originIcon }).addTo(map);
            originMarker.bindPopup(`
                <div class="p-2 text-center min-w-[160px]">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-[#E65C19] bg-[#E65C19]/10 px-2 py-0.5 rounded-full">Estás aquí</span>
                    <h4 class="font-black text-[#0F2A3F] text-base mt-1.5">${escapeHtml(originItem.name)}</h4>
                    ${originItem.address ? `<p class="text-xs text-slate-500 mt-1">${escapeHtml(originItem.address)}</p>` : ''}
                </div>
            `);

            const bounds = [originCoords];

            distances.forEach((loc) => {
                const destinoData = DATA.find(d => d.name === loc.destino);
                const destCoords = extractCoords(destinoData);

                if (destCoords) {
                    bounds.push(destCoords);

                    // Línea discontinua de ruta
                    L.polyline([originCoords, destCoords], {
                        color: '#2F70B3',
                        weight: 3,
                        dashArray: '6, 8',
                        opacity: 0.8
                    }).addTo(map);

                    // Pin Destino (Azul Marino)
                    const destIcon = L.divIcon({
                        className: 'custom-map-pin-dest',
                        html: `
                            <div class="relative flex items-center justify-center cursor-pointer group">
                                <div class="w-8 h-8 bg-[#0F2A3F] text-white rounded-full flex items-center justify-center shadow-md border-2 border-white group-hover:bg-[#E65C19] group-hover:scale-110 transition-all">
                                    <span class="text-xs font-bold">🍷</span>
                                </div>
                            </div>
                        `,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16],
                        popupAnchor: [0, -16]
                    });

                    const marker = L.marker(destCoords, { icon: destIcon }).addTo(map);
                    window.currentDistMarkers[loc.destino] = marker;

                    const mapsDirUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originItem.name + ' ' + (originItem.ciudad || ''))}&destination=${encodeURIComponent(loc.destino + ' ' + (destinoData?.ciudad || ''))}`;

                    const popupContent = `
                        <div class="p-2 max-w-[220px]">
                            ${destinoData && destinoData.image ? `<img src="${destinoData.image}" class="w-full h-24 object-cover rounded-xl mb-2.5 shadow-xs">` : ''}
                            <h4 class="font-black text-[#0F2A3F] text-sm leading-snug">${escapeHtml(loc.destino)}</h4>
                            <div class="flex flex-wrap items-center gap-2 text-xs text-slate-600 my-2 font-bold">
                                <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200">🚶 ${escapeHtml(loc.distancia)}</span>
                                <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200">⏱️ ${escapeHtml(loc.tiempo)}</span>
                                ${destinoData && destinoData.rating ? `<span class="bg-[#BA2B2B]/10 text-[#BA2B2B] px-2 py-0.5 rounded border border-[#BA2B2B]/20">⭐ ${destinoData.rating}</span>` : ''}
                            </div>
                            <div class="flex flex-col gap-1.5 mt-2">
                                <a href="${mapsDirUrl}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-1.5 rounded-xl font-bold transition-colors shadow-xs flex items-center justify-center gap-1 text-decoration-none">
                                    🗺️ Cómo llegar GPS
                                </a>
                                ${destinoData ? `
                                <button onclick="openDetail('${destinoData.id}')" class="w-full bg-[#0F2A3F] text-white text-xs py-1.5 rounded-xl font-bold hover:bg-[#E65C19] transition-colors shadow-xs flex items-center justify-center gap-1">
                                    Ficha completa ➔
                                </button>` : ''}
                            </div>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                }
            });

            if (bounds.length > 1) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            setTimeout(() => {
                map.invalidateSize();
            }, 200);
        }

        // --- INICIAR ---
        document.addEventListener('DOMContentLoaded', loadData);

    </script>

    <div id="lightbox"
        class="fixed inset-0 z-[100] bg-slate-950/95 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center backdrop-blur-md"
        onclick="if(event.target === this) closeLightbox()">

        <button onclick="closeLightbox()"
            class="absolute top-4 right-4 text-white/80 hover:text-white hover:bg-white/20 bg-white/10 rounded-full p-2.5 transition-all z-50 backdrop-blur-md border border-white/10 shadow-lg" title="Cerrar (Esc)">
            <i data-lucide="x" width="24" height="24"></i>
        </button>

        <button onclick="changeLightboxSlide(-1)"
            class="absolute left-3 md:left-8 text-white/80 hover:text-white hover:scale-110 transition-all p-3 z-50 bg-white/10 hover:bg-white/20 rounded-full backdrop-blur-md border border-white/10 shadow-lg" title="Anterior">
            <i data-lucide="chevron-left" width="32" height="32"></i>
        </button>

        <div
            class="relative max-w-7xl max-h-screen w-full h-full flex flex-col items-center justify-center p-4 md:p-10">

            <img id="lightbox-img" src=""
                class="max-h-[82vh] max-w-full object-contain shadow-2xl rounded-xl select-none transition-transform duration-300 border border-white/10"
                alt="Galería">

            <div id="lightbox-caption-container"
                class="absolute bottom-8 left-0 right-0 text-center pointer-events-none">
                <div class="inline-block bg-black/60 backdrop-blur-md text-white px-6 py-3 rounded-full max-w-[90%]">
                    <p id="lightbox-caption" class="text-sm md:text-lg font-brand tracking-wide"></p>
                    <p id="lightbox-counter" class="text-xs text-white/60 mt-1 font-sans uppercase tracking-widest"></p>
                </div>
            </div>
        </div>

        <button onclick="changeLightboxSlide(1)"
            class="absolute right-3 md:right-8 text-white/80 hover:text-white hover:scale-110 transition-all p-3 z-50 bg-white/10 hover:bg-white/20 rounded-full backdrop-blur-md border border-white/10 shadow-lg" title="Siguiente">
            <i data-lucide="chevron-right" width="32" height="32"></i>
        </button>
    </div>
    <div class="fixed bottom-14 right-4 z-[1050] fab-container"
        title="¿Buscas recomendaciones? ¡Te chivamos los mejores sitios! 🤫">
        <button type="button"
            class="group w-14 h-14 bg-[#E65C19] text-white rounded-full shadow-xl hover:bg-[#0F2A3F] hover:scale-110 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-[#E65C19]/50 border-2 border-white/30"
            data-bs-toggle="popover" data-bs-placement="top" data-bs-offset="-125, 15"
            data-bs-custom-class="custom-popover" data-bs-html="true"
            data-bs-title="<div class='flex items-center gap-2'><svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'></circle><line x1='12' y1='16' x2='12' y2='12'></line><line x1='12' y1='8' x2='12.01' y2='8'></line></svg> <span class='font-bold'>Recomendador de ComoVisito</span></div>"
            data-bs-content="<div class='text-sm text-[#0F2A3F] mb-3'>Usamos la magia de <b>Gemini Notebook</b> para darte recomendaciones gastronómicas <b>únicas</b>.<br><br>Necesitas tu cuenta de <b>Google</b>.<br><br></div><a href='https://notebooklm.google.com/notebook/6b38dfab-ba8b-449f-a4f3-48154aaa29e4' target='_blank' rel='noopener noreferrer' class='inline-block px-4 py-2 bg-[#0F2A3F] text-white text-sm font-bold rounded-xl hover:bg-[#E65C19] transition-colors shadow-md text-decoration-none'>¡Ir al Chat! 🚀</a>">

            <!-- Icono del Botón -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 fill-current group-hover:animate-pulse"
                viewBox="0 0 24 24">
                <path d="M0 0h24v24H0V0z" fill="none" />
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" />
            </svg>
            <span class="sr-only">Recomendaciones de ComoVisito</span>
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
